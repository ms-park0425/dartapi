<text x="140" y="746" font-size="27" fill="#273747" font-weight="700">PDF를 직접 보고 빈칸·기존 값 검토</text>
<text x="140" y="790" font-size="21" fill="#586372" font-weight="400">회사별 출처 힌트를 참고해 확인된 값을 보충·보정합니다.</text>
