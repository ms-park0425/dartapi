<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1350" viewBox="0 0 1120 1350">
<rect width="100%" height="100%" fill="white"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<text x="48" y="54" font-size="28" fill="#293849" font-weight="700">분기 공시 입력 절차</text>
<text x="48" y="89" font-size="20" fill="#667383" font-weight="400">최초 설정을 마친 뒤, Codex 프로젝트 채팅에서 분기를 요청합니다.</text>
<rect x="60" y="116" width="1000" height="132" rx="10" fill="#FBFCFD" stroke="#C9D3DF" stroke-width="1"/>
<text x="82" y="161" font-size="27" fill="#6D7E92" font-weight="400">01</text>
<text x="146" y="147" font-size="19" fill="#5C7089" font-weight="400">담당자 요청</text>
<text x="146" y="184" font-size="27" fill="#26384C" font-weight="700">분기와 작업 Excel 지정</text>
<text x="146" y="224" font-size="22" fill="#42556C" font-weight="400">“202609 분기보고서 채워줘”</text>
<path d="M560 258V281" stroke="#4B627C" stroke-width="4" fill="none"/>
<path d="M551 277L560 291L569 277Z" fill="#4B627C"/>
<rect x="36" y="308" width="1048" height="770" rx="14" fill="#F0F4F9" stroke="#A9B9CC" stroke-width="2"/>
<text x="62" y="351" font-size="26" fill="#2E4866" font-weight="700">Codex 자동 진행 구간</text>
<text x="62" y="382" font-size="20" fill="#4F657E" font-weight="400">아래 네 단계는 Codex가 같은 채팅 안에서 이어서 수행합니다.</text>
<rect x="60" y="405" width="1000" height="132" rx="10" fill="#FFFFFF" stroke="#C9D3DF" stroke-width="1"/>
<text x="82" y="450" font-size="27" fill="#6D7E92" font-weight="400">02</text>
<text x="146" y="436" font-size="19" fill="#5C7089" font-weight="400">자료 수집</text>
<text x="146" y="473" font-size="27" fill="#26384C" font-weight="700">해당 분기의 공시·IR 자료 수집</text>
<text x="146" y="513" font-size="22" fill="#42556C" font-weight="400">DART와 회사 공식 자료에서 보고서·PDF를 모읍니다.</text>
<path d="M560 546V556" stroke="#4B627C" stroke-width="4" fill="none"/>
<path d="M551 552L560 566L569 552Z" fill="#4B627C"/>
<rect x="60" y="576" width="1000" height="132" rx="10" fill="#FFFFFF" stroke="#C9D3DF" stroke-width="1"/>
<text x="82" y="621" font-size="27" fill="#6D7E92" font-weight="400">03</text>
<text x="146" y="607" font-size="19" fill="#5C7089" font-weight="400">코드 · 1차 입력</text>
<text x="146" y="644" font-size="27" fill="#26384C" font-weight="700">공시에서 숫자를 추출해 Excel 입력</text>
<text x="146" y="684" font-size="22" fill="#42556C" font-weight="400">단위와 기간을 맞춰 1차 결과를 저장합니다.</text>
<path d="M560 717V727" stroke="#4B627C" stroke-width="4" fill="none"/>
<path d="M551 723L560 737L569 723Z" fill="#4B627C"/>
<rect x="60" y="747" width="1000" height="132" rx="10" fill="#FFFFFF" stroke="#C9D3DF" stroke-width="1"/>
<text x="82" y="792" font-size="27" fill="#6D7E92" font-weight="400">04</text>
<text x="146" y="778" font-size="19" fill="#5C7089" font-weight="400">GPT · 2차 검토</text>
<text x="146" y="815" font-size="27" fill="#26384C" font-weight="700">PDF를 직접 보고 빈칸·기존 값 검토</text>
<text x="146" y="855" font-size="22" fill="#42556C" font-weight="400">회사별 출처 힌트를 참고해 확인된 값을 보충·보정합니다.</text>
<path d="M560 888V898" stroke="#4B627C" stroke-width="4" fill="none"/>
<path d="M551 894L560 908L569 894Z" fill="#4B627C"/>
<rect x="60" y="918" width="1000" height="132" rx="10" fill="#FFFFFF" stroke="#C9D3DF" stroke-width="1"/>
<text x="82" y="963" font-size="27" fill="#6D7E92" font-weight="400">05</text>
<text x="146" y="949" font-size="19" fill="#5C7089" font-weight="400">검산 · 최종 저장</text>
<text x="146" y="986" font-size="27" fill="#26384C" font-weight="700">과거 데이터·수식을 확인하고 결과 저장</text>
<text x="146" y="1026" font-size="22" fill="#42556C" font-weight="400">최종 Excel 링크와 미확인·보류 항목을 전달합니다.</text>
<path d="M560 1090V1113" stroke="#4B627C" stroke-width="4" fill="none"/>
<path d="M551 1109L560 1123L569 1109Z" fill="#4B627C"/>
<rect x="60" y="1138" width="1000" height="132" rx="10" fill="#FBFCFD" stroke="#C9D3DF" stroke-width="1"/>
<text x="82" y="1183" font-size="27" fill="#6D7E92" font-weight="400">06</text>
<text x="146" y="1169" font-size="19" fill="#5C7089" font-weight="400">담당자 확인</text>
<text x="146" y="1206" font-size="27" fill="#26384C" font-weight="700">최종 Excel과 남은 확인 사항 검토</text>
<text x="146" y="1246" font-size="22" fill="#42556C" font-weight="400">결과 링크를 열고 요청한 분기와 보류 항목을 확인합니다.</text>
<path d="M48 1302H1072" stroke="#DCE2EA"/>
<text x="48" y="1332" font-size="20" fill="#5D6E82" font-weight="400">과거 데이터·수식 보존   ·   같은 항목의 정밀값 유지   ·   미확인 값은 보류</text>
</g>
</svg>